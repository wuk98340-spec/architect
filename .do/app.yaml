name: architect-case-library
region: sgp

services:
  - name: architect-api
    github:
      repo: wuk98340-spec/architect
      branch: codex/local-repair-mode
      deploy_on_push: false
    dockerfile_path: Dockerfile
    http_port: 8080
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-2gb
    health_check:
      http_path: /healthz
    envs:
      - key: ARCHITECT_SERVICE_ROLE
        value: api
        scope: RUN_TIME
      - key: ARCHITECT_API_HOST
        value: 0.0.0.0
        scope: RUN_TIME
      - key: ARCHITECT_DATA_ROOT
        value: /tmp/architect
        scope: RUN_TIME
      - key: ARCHITECT_JOBS_ROOT
        value: /tmp/architect/worker-jobs
        scope: RUN_TIME
      - key: ARCHITECT_CASE_PACKAGES_ROOT
        value: /tmp/architect/case-packages
        scope: RUN_TIME

workers:
  - name: architect-research-worker
    github:
      repo: wuk98340-spec/architect
      branch: codex/local-repair-mode
      deploy_on_push: false
    dockerfile_path: Dockerfile
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-2gb
    envs:
      - key: ARCHITECT_SERVICE_ROLE
        value: worker
        scope: RUN_TIME
      - key: ARCHITECT_API_HOST
        value: 0.0.0.0
        scope: RUN_TIME
      - key: ARCHITECT_DATA_ROOT
        value: /tmp/architect
        scope: RUN_TIME
      - key: ARCHITECT_JOBS_ROOT
        value: /tmp/architect/worker-jobs
        scope: RUN_TIME
      - key: ARCHITECT_CASE_PACKAGES_ROOT
        value: /tmp/architect/case-packages
        scope: RUN_TIME

# Add the following as encrypted app-level RUN_TIME variables in the
# DigitalOcean dashboard; do not commit their values here:
# ARCHITECT_STORAGE_BACKEND=s3
# ARCHITECT_S3_ENDPOINT=https://sgp1.digitaloceanspaces.com
# ARCHITECT_S3_REGION=sgp1
# ARCHITECT_S3_BUCKET=<your-space-name>
# ARCHITECT_S3_PREFIX=architect
# ARCHITECT_S3_ACCESS_KEY_ID=<Spaces access key>
# ARCHITECT_S3_SECRET_ACCESS_KEY=<Spaces secret key>
# DEEPSEEK_API_KEY=<DeepSeek API key>
# ARCHITECT_LLM_PROVIDER=deepseek
# ARCHITECT_LLM_MODEL=deepseek-v4-flash
# DEEPSEEK_BASE_URL=https://api.deepseek.com
# ARCHITECT_LLM_TIMEOUT_SECONDS=90
# ARCHITECT_LLM_MAX_TOKENS=16000
